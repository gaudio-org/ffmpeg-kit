group = "com.arthenica.ffmpegkit.flutter"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.10"
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.arthenica.ffmpegkit.flutter"
    compileSdk = 35
    ndkVersion = "27.0.12077973"  // NDK r27 for 16KB page size support

    lintOptions {
        disable 'GradleCompatible'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
        versionCode = 603
        versionName = "6.0.3"
    }

    // 16KB 페이지 크기 지원을 위한 패키징 옵션
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
        // .so 파일 중복 방지
        pickFirst 'lib/arm64-v8a/libffmpegkit.so'
        pickFirst 'lib/arm64-v8a/libffmpegkit_abidetect.so'
        pickFirst 'lib/armeabi-v7a/libffmpegkit.so'
        pickFirst 'lib/armeabi-v7a/libffmpegkit_abidetect.so'
    }

    dependencies {
        implementation('androidx.annotation:annotation:1.5.0')
        // 압축 해제된 AAR의 JAR 파일을 직접 사용
        implementation files('libs/ffmpeg-kit-extracted/classes.jar')
        implementation('com.arthenica:smart-exception-java:0.2.1') // Dependency from Live
        implementation('com.arthenica:smart-exception-common:0.2.1') // Dependency from Live        
    }
}